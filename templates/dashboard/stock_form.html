{% extends "dashboard/base.html" %}
{% block heading %}{{ title }}{% endblock %}
{% block subheading %}<div class="small text-muted">{{ lead }}</div>{% endblock %}
{% block content %}
<div class="panel p-4 p-lg-5" style="max-width: 720px;">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-accent" type="submit"><i class="bi bi-check2-circle" aria-hidden="true"></i> Record Stock Movement</button>
      <a class="btn btn-soft" href="{% url 'dashboard:inventory' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
