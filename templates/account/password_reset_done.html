{% extends "base.html" %}
{% block title %}Check your email · {{ site_settings.business_name }}{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="h3">Check your email</h1>
      <p>If an account exists for that address, a reset link is on the way. Locally, look in the server terminal.</p>
      <a href="{% url 'account_login' %}">Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}
